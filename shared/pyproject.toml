[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docuflow-shared"
version = "0.1.0"
description = "Schémas Pydantic et utilitaires communs à la plateforme docuflow-ai."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[tool.setuptools.packages.find]
where = ["src"]
