name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: uv pip install --system ruff
      - name: Ruff check
        run: ruff check shared
      - name: Ruff format
        run: ruff format --check shared

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install shared package and development dependencies
        run: |
          uv pip install --system -e ./shared -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -m "not slow and not integration and not e2e"
